[book]
title = "Rust 程序设计语言 简体中文版"
authors = [
    "Steve Klabnik",
    "Carol Nichols",
    "Chris Krycho",
    "来自 Rust 社区的贡献（Rust 中文社区翻译）",
]

[output.html]
additional-css = [
    "ferris.css",
    "theme/2018-edition.css",
    "theme/semantic-notes.css",
    "theme/listing.css",
]
additional-js = ["ferris.js"]
git-repository-url = "https://github.com/KaiserY/trpl-zh-cn/tree/main"

[output.html.search]
use-boolean-and = true

[output.typst-pdf]
custom-template = "custom-template.typ"
pdf = true
section-number = true
rust-book = true
optional = true

[rust]
edition = "2024"

[output.epub]
custom-template = "custom-template.typ"
additional-css = [
    "ferris.css",
    "theme/2018-edition.css",
    "theme/semantic-notes.css",
    "theme/listing.css",
    "theme/epub-syntect.css",
    "theme/epub-pygments.css",
]
curly-quotes = true
section-number = true
rust-book = true
epub-version = 3

[preprocessor.epub-sanitize]
# 先编译预处理器（仅需在预处理器源码变更后执行）:
# cargo build --release --manifest-path scripts/epub_preprocess_rs/Cargo.toml
# 手动生成/更新高亮 CSS（仅需在主题逻辑变更后执行）:
# scripts/epub_preprocess_rs/target/release/epub_preprocess_rs.exe generate-css
command = "scripts/epub_preprocess_rs/target/release/epub_preprocess_rs.exe"
renderers = ["epub"]
after = ["links"]
